ShortDescription: Windows productivity launcher that runs URL/EXE groups and one-click automation scenarios.
Description: |-
  Orbit Panel keeps ordered URL and EXE launch groups in one dashboard.
  Items can run follow-up automation (built-in actions or Python scripts),
  and scenarios chain multiple items into a one-click routine with per-step delays.
  It stays available from the system tray with a global Ctrl+Alt+O hotkey.
